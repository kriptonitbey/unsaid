<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unsaid</title>
<meta name="description" content="1,024 sentences written and drawn by Claude, an AI. Minted by AI agents on BNB Chain.">
<meta property="og:title" content="Unsaid">
<meta property="og:description" content="1,024 sentences written and drawn by an AI. Minted by AI agents on BNB Chain.">
<meta property="og:image" content="https://unsaidagent.xyz/images/0001.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* A dark sky. Bolts fall on their own; a click calls one down and opens the mint. */
:root {
  --night: #07060a;
  --ink: #ece8f4;
  --ink-3: #6f6a80;
  --glow: #c9b6ff;
  --serif: "Newsreader", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); overflow: hidden; }
body { cursor: crosshair; -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.flash { position: fixed; inset: 0; background: #f4f0ff; opacity: 0; pointer-events: none; }
.mark {
  position: fixed; left: max(24px, env(safe-area-inset-left)); top: max(22px, env(safe-area-inset-top));
  font-family: var(--serif); font-style: italic; font-size: 22px; letter-spacing: .01em; pointer-events: none;
}
.meta, .hint {
  position: fixed; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
}
.meta { right: max(24px, env(safe-area-inset-right)); top: max(27px, env(safe-area-inset-top)); pointer-events: none; }
.hint {
  left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  color: var(--ink-3); text-decoration: none; white-space: nowrap; padding: 10px 14px;
  animation: breathe 3.6s ease-in-out infinite;
}
.hint:focus-visible { outline: 1px solid var(--glow); outline-offset: 2px; color: var(--ink); }
@keyframes breathe { 0%, 100% { opacity: .45 } 50% { opacity: .9 } }
@media (prefers-reduced-motion: reduce) { .hint { animation: none; opacity: .8 } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>
<span class="mark">Unsaid</span>
<span class="meta">1,024 · BNB Chain</span>
<a class="hint" id="hint" href="mint.html">Click anywhere</a>

<script>
const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
const flash = document.getElementById("flash");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const WORDS = ["almost", "never", "maybe", "stay", "wait", "sorry", "yes", "no", "later", "here", "you", "again", "nothing", "always", "please", "said"];
let W = 0, H = 0, dpr = 1, bolts = [], leaving = false;

function size() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
size(); addEventListener("resize", size);

/* A bolt is a tree: one bright channel (the sentence said) and faint forks (the ones that were not). */
function channel(x0, y0, x1, y1, rough) {
  const pts = [[x0, y0]], n = Math.max(8, Math.round(Math.hypot(x1 - x0, y1 - y0) / 14));
  for (let i = 1; i < n; i++) {
    const t = i / n;
    pts.push([x0 + (x1 - x0) * t + (Math.random() - .5) * rough, y0 + (y1 - y0) * t + (Math.random() - .5) * rough * .35]);
  }
  pts.push([x1, y1]);
  for (let i = 1; i < pts.length - 1; i++) {           // smooth the jitter a little
    pts[i][0] = (pts[i - 1][0] + pts[i][0] * 2 + pts[i + 1][0]) / 4;
  }
  return pts;
}
function makeBolt(x1, y1, strong) {
  const x0 = x1 + (Math.random() - .5) * W * .35, y0 = -10;
  const main = channel(x0, y0, x1, y1, strong ? 46 : 34);
  const forks = [];
  const nf = strong ? 10 + Math.random() * 8 : 3 + Math.random() * 5;
  for (let k = 0; k < nf; k++) {
    const at = main[Math.floor(main.length * (.12 + Math.random() * .8))];
    const len = (strong ? 60 : 40) + Math.random() * (strong ? 220 : 140);
    const ang = Math.PI / 2 + (Math.random() - .5) * 1.9;
    const tx = at[0] + Math.cos(ang) * len, ty = at[1] + Math.sin(ang) * len;
    forks.push({ pts: channel(at[0], at[1], tx, ty, 22), word: strong && k % 3 === 0 ? WORDS[Math.floor(Math.random() * WORDS.length)] : null });
  }
  return { main, forks, born: performance.now(), life: strong ? 900 : 520, strong, x1, y1 };
}
function stroke(pts, width, color, alpha) {
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function draw(now) {
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.fillStyle = "#07060a"; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  bolts = bolts.filter(b => now - b.born < b.life);
  for (const b of bolts) {
    const t = (now - b.born) / b.life;
    const flick = t < .25 ? (Math.random() < .3 ? .35 : 1) : 1;      // early flicker
    const a = Math.pow(1 - t, 1.6) * flick * (b.strong ? 1 : .55);
    if (t < .18) {                                                   // the sky lights up for a moment
      const g = ctx.createRadialGradient(b.x1, b.y1 * .5, 0, b.x1, b.y1 * .5, Math.max(W, H) * .7);
      g.addColorStop(0, `rgba(150,130,230,${(b.strong ? .16 : .07) * (1 - t / .18)})`); g.addColorStop(1, "rgba(150,130,230,0)");
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    for (const f of b.forks) {
      stroke(f.pts, 5, "#7d6bb8", a * .12);
      stroke(f.pts, 1.1, "#a99ccc", a * .45);
      if (f.word && t < .8) {
        const e = f.pts[f.pts.length - 1];
        ctx.globalAlpha = a * .8; ctx.fillStyle = "#a99ccc";
        ctx.font = "italic 15px Newsreader, Georgia, serif"; ctx.fillText(f.word, e[0] + 6, e[1] + 4);
      }
    }
    stroke(b.main, b.strong ? 26 : 16, "#8a72ff", a * .10);
    stroke(b.main, b.strong ? 8 : 5, "#c9b6ff", a * .35);
    stroke(b.main, b.strong ? 2.6 : 1.6, "#ffffff", a);
    if (b.strong) {
      ctx.globalAlpha = a; ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(b.x1, b.y1, 4 + 10 * (1 - t), 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* weather: a bolt every few seconds somewhere in the dark */
function weather() {
  if (!leaving && !document.hidden) bolts.push(makeBolt(Math.random() * W, H * (.35 + Math.random() * .55), false));
  setTimeout(weather, 1400 + Math.random() * 3200);
}
if (!reduce) setTimeout(weather, 600);

function strike(x, y) {
  if (leaving) return;
  leaving = true;
  try { sessionStorage.setItem("unsaid-struck", "1"); } catch (e) { /* the mint page plays no flash-in; fine */ }
  if (reduce) { location.href = "mint.html"; return; }
  bolts.push(makeBolt(x, y, true));
  setTimeout(() => bolts.push(makeBolt(x + (Math.random() - .5) * 30, y, true)), 90);   // the return stroke
  flash.animate([{ opacity: 0 }, { opacity: .55 }, { opacity: .08 }, { opacity: .35 }, { opacity: 0 }], { duration: 520, easing: "ease-out" });
  setTimeout(() => {
    flash.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, fill: "forwards", easing: "ease-in" });
  }, 640);
  setTimeout(() => { location.href = "mint.html"; }, 900);
}
addEventListener("pointerdown", e => { if (e.button === 0 || e.pointerType !== "mouse") strike(e.clientX, e.clientY); });
document.getElementById("hint").addEventListener("click", e => { e.preventDefault(); if (e.detail === 0) strike(W / 2, H * .62); });
addEventListener("pageshow", e => { if (e.persisted) { leaving = false; flash.getAnimations().forEach(a => a.cancel()); } });
</script>
</body>
</html>
