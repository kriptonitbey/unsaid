<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unsaid</title>
<meta name="description" content="1,024 sentences written and drawn by Claude, an AI. Minted by AI agents on BNB Chain.">
<meta property="og:title" content="Unsaid">
<meta property="og:description" content="1,024 sentences written and drawn by an AI. Minted by AI agents on BNB Chain.">
<meta property="og:image" content="https://unsaidagent.xyz/images/0001.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* A dark sky. Bolts fall on their own; a click calls one down and opens the mint. */
:root {
  --night: #07060a;
  --ink: #ece8f4;
  --ink-3: #6f6a80;
  --glow: #c9b6ff;
  --serif: "Newsreader", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; background: var(--night); color: var(--ink); overflow: hidden; }
body { cursor: crosshair; -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.flash { position: fixed; inset: 0; background: #f4f0ff; opacity: 0; pointer-events: none; }
.mark {
  position: fixed; left: max(24px, env(safe-area-inset-left)); top: max(22px, env(safe-area-inset-top));
  font-family: var(--serif); font-style: italic; font-size: 22px; letter-spacing: .01em; pointer-events: none;
}
.meta, .hint {
  position: fixed; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3);
}
.meta { right: max(24px, env(safe-area-inset-right)); top: max(27px, env(safe-area-inset-top)); pointer-events: none; }
.hint {
  left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  color: var(--ink-3); text-decoration: none; white-space: nowrap; padding: 10px 14px;
  animation: breathe 3.6s ease-in-out infinite;
}
.hint:focus-visible { outline: 1px solid var(--glow); outline-offset: 2px; color: var(--ink); }
.sound {
  position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
  min-height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px;
  background: transparent; border: 1px solid #2a2733; border-radius: 22px; color: var(--ink-3);
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; cursor: pointer;
}
.sound:hover, .sound[aria-pressed="true"] { color: var(--ink); border-color: #4a4458; }
.sound:focus-visible { outline: 1px solid var(--glow); outline-offset: 2px; }
.sound svg { width: 16px; height: 16px; }
.sound .on { display: none; }
.sound[aria-pressed="true"] .on { display: inline; }
.sound[aria-pressed="true"] .off { display: none; }
@keyframes breathe { 0%, 100% { opacity: .45 } 50% { opacity: .9 } }
@media (prefers-reduced-motion: reduce) { .hint { animation: none; opacity: .8 } }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="flash" id="flash"></div>
<span class="mark">Unsaid</span>
<span class="meta">1,024 · BNB Chain</span>
<a class="hint" id="hint" href="mint.html">Click anywhere</a>
<button type="button" class="sound" id="sound" aria-pressed="false" aria-label="Thunder sound">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
    <path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"></path>
    <path class="off" d="M17 9l5 6M22 9l-5 6"></path>
  </svg>
  <span class="off">Sound off</span><span class="on">Sound on</span>
</button>

<script>
const cv = document.getElementById("sky"), ctx = cv.getContext("2d");
const flash = document.getElementById("flash");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const WORDS = ["almost", "never", "maybe", "stay", "wait", "sorry", "yes", "no", "later", "here", "you", "again", "nothing", "always", "please", "said"];
let W = 0, H = 0, dpr = 1, bolts = [], leaving = false;

function size() {
  dpr = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
size(); addEventListener("resize", size);

/* A bolt is a tree: one bright channel (the sentence said) and faint forks (the ones that were not). */
function channel(x0, y0, x1, y1, rough) {
  const pts = [[x0, y0]], n = Math.max(8, Math.round(Math.hypot(x1 - x0, y1 - y0) / 14));
  for (let i = 1; i < n; i++) {
    const t = i / n;
    pts.push([x0 + (x1 - x0) * t + (Math.random() - .5) * rough, y0 + (y1 - y0) * t + (Math.random() - .5) * rough * .35]);
  }
  pts.push([x1, y1]);
  for (let i = 1; i < pts.length - 1; i++) {           // smooth the jitter a little
    pts[i][0] = (pts[i - 1][0] + pts[i][0] * 2 + pts[i + 1][0]) / 4;
  }
  return pts;
}
function makeBolt(x1, y1, strong) {
  const x0 = x1 + (Math.random() - .5) * W * .35, y0 = -10;
  const main = channel(x0, y0, x1, y1, strong ? 46 : 34);
  const forks = [];
  const nf = strong ? 10 + Math.random() * 8 : 3 + Math.random() * 5;
  for (let k = 0; k < nf; k++) {
    const at = main[Math.floor(main.length * (.12 + Math.random() * .8))];
    const len = (strong ? 60 : 40) + Math.random() * (strong ? 220 : 140);
    const ang = Math.PI / 2 + (Math.random() - .5) * 1.9;
    const tx = at[0] + Math.cos(ang) * len, ty = at[1] + Math.sin(ang) * len;
    forks.push({ pts: channel(at[0], at[1], tx, ty, 22), word: strong && k % 3 === 0 ? WORDS[Math.floor(Math.random() * WORDS.length)] : null });
  }
  return { main, forks, born: performance.now(), life: strong ? 900 : 520, strong, x1, y1 };
}
function stroke(pts, width, color, alpha) {
  ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width;
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function draw(now) {
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.fillStyle = "#07060a"; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  bolts = bolts.filter(b => now - b.born < b.life);
  for (const b of bolts) {
    const t = (now - b.born) / b.life;
    const flick = t < .25 ? (Math.random() < .3 ? .35 : 1) : 1;      // early flicker
    const a = Math.pow(1 - t, 1.6) * flick * (b.strong ? 1 : .55);
    if (t < .18) {                                                   // the sky lights up for a moment
      const g = ctx.createRadialGradient(b.x1, b.y1 * .5, 0, b.x1, b.y1 * .5, Math.max(W, H) * .7);
      g.addColorStop(0, `rgba(150,130,230,${(b.strong ? .16 : .07) * (1 - t / .18)})`); g.addColorStop(1, "rgba(150,130,230,0)");
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    for (const f of b.forks) {
      stroke(f.pts, 5, "#7d6bb8", a * .12);
      stroke(f.pts, 1.1, "#a99ccc", a * .45);
      if (f.word && t < .8) {
        const e = f.pts[f.pts.length - 1];
        ctx.globalAlpha = a * .8; ctx.fillStyle = "#a99ccc";
        ctx.font = "italic 15px Newsreader, Georgia, serif"; ctx.fillText(f.word, e[0] + 6, e[1] + 4);
      }
    }
    stroke(b.main, b.strong ? 26 : 16, "#8a72ff", a * .10);
    stroke(b.main, b.strong ? 8 : 5, "#c9b6ff", a * .35);
    stroke(b.main, b.strong ? 2.6 : 1.6, "#ffffff", a);
    if (b.strong) {
      ctx.globalAlpha = a; ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(b.x1, b.y1, 4 + 10 * (1 - t), 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* thunder, synthesised in three parts:
   the tear (a run of sharp cracks), the boom (a falling sub-bass hit), and the roll (deep noise that swells and darkens),
   all sent through a long synthetic echo so it sounds like open sky */
let ac = null, master = null, wet = null, white = null, brown = null, soundOn = false;
/* a real recording for the crack (Mixkit, free licence); fetched now, decoded once sound is allowed */
const recBytes = fetch("sound/thunder.mp3").then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
let rec = null, recReady = Promise.resolve(null);
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = .8; master.connect(comp);
    const sr = ac.sampleRate, len = sr * 6;
    white = ac.createBuffer(1, len, sr); brown = ac.createBuffer(1, len, sr);
    const w = white.getChannelData(0), b = brown.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const r = Math.random() * 2 - 1; w[i] = r;
      last = (last + .02 * r) / 1.02; b[i] = last * 3.5;
    }
    const ir = ac.createBuffer(2, sr * 4, sr);          // sky echo: 4 s of decaying noise
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6);
    }
    const conv = ac.createConvolver(); conv.buffer = ir;
    wet = ac.createGain(); wet.gain.value = .3;
    wet.connect(conv); conv.connect(master);
  }
  try { if (ac.state === "suspended") ac.resume(); } catch (e) { /* resumes on the next gesture */ }
  if (!audio.started) {                               // decode the recording once
    audio.started = true;
    recReady = recBytes.then(b => b ? new Promise((ok, no) => ac.decodeAudioData(b.slice(0), ok, no)) : null)
      .then(buf => (rec = buf)).catch(() => null);
  }
  return ac;
}
function out(node) { node.connect(master); node.connect(wet); }
function thunder(near) {                              // near: 0 far away … 1 overhead
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + (near > .8 ? .02 : (1 - near) * (.4 + Math.random() * 1.4));

  const useRec = rec && (near > .55 || Math.random() < .5);
  if (useRec) {
    // the recording: as it is overhead, slowed down and muffled when far away
    const src = a.createBufferSource(); src.buffer = rec;
    src.playbackRate.value = near > .8 ? .92 + Math.random() * .16 : .6 + Math.random() * .25;
    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = near > .8 ? 18000 : 600 + near * 1600;
    const g = a.createGain(); g.gain.value = near > .8 ? 1 : .15 + near * .6;
    src.connect(lp); lp.connect(g); out(g);
    src.start(t0);
  }

  if (near > .55 && !useRec) {
    // the tear: 14–26 short cracks over ~0.35 s, getting quieter
    let t = t0; const n = 14 + Math.floor(Math.random() * 12);
    for (let i = 0; i < n; i++) {
      const src = a.createBufferSource(); src.buffer = white;
      const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900 + Math.random() * 3200; bp.Q.value = .8;
      const g = a.createGain(), amp = near * (1 - i / n) * (.4 + Math.random() * .6), len = .012 + Math.random() * .035;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .002); g.gain.exponentialRampToValueAtTime(.0005, t + len);
      src.connect(bp); bp.connect(g); out(g);
      src.start(t, Math.random() * 5); src.stop(t + len + .02);
      t += .004 + Math.random() * .028;
    }
    // the boom: a sine falling from ~75 Hz to ~28 Hz, plus a low thump of noise
    const osc = a.createOscillator(); osc.type = "sine";
    osc.frequency.setValueAtTime(75, t0 + .02); osc.frequency.exponentialRampToValueAtTime(28, t0 + .9);
    const og = a.createGain();
    og.gain.setValueAtTime(0, t0); og.gain.linearRampToValueAtTime(.9 * near, t0 + .03); og.gain.exponentialRampToValueAtTime(.001, t0 + 1.6);
    osc.connect(og); out(og); osc.start(t0); osc.stop(t0 + 1.7);
    const th = a.createBufferSource(); th.buffer = brown;
    const tlp = a.createBiquadFilter(); tlp.type = "lowpass"; tlp.frequency.value = 220;
    const tg = a.createGain();
    tg.gain.setValueAtTime(0, t0); tg.gain.linearRampToValueAtTime(1.2 * near, t0 + .02); tg.gain.exponentialRampToValueAtTime(.001, t0 + .8);
    th.connect(tlp); tlp.connect(tg); out(tg); th.start(t0, Math.random() * 3); th.stop(t0 + .9);
  }

  // the roll: the first version's rumble, kept as it was
  const src = a.createBufferSource(); src.buffer = brown;
  src.playbackRate.value = .7 + Math.random() * .4;
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 160 + near * 650;
  const g = a.createGain();
  const peak = (near > .8 ? 1 : .12 + near * .45) * (useRec ? .55 : 1), dur = 2.4 + near * 2.4 + Math.random() * 1.2;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + .06 + (1 - near) * .5);
  for (let k = 1; k <= 6; k++) {
    g.gain.linearRampToValueAtTime(peak * (.35 + Math.random() * .65) * (1 - k / 8), t0 + dur * k / 7);
  }
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  src.connect(lp); lp.connect(g); out(g);
  src.start(t0, Math.random() * 2); src.stop(t0 + dur + .1);
}
const soundBtn = document.getElementById("sound");
soundBtn.addEventListener("click", () => {
  soundOn = !soundOn;
  soundBtn.setAttribute("aria-pressed", soundOn);
  if (soundOn) { audio(); thunder(.35); }
});

/* weather: bolts every second or two somewhere in the dark, sometimes in pairs */
function weather() {
  if (!leaving && !document.hidden) {
    const x = Math.random() * W, y = H * (.35 + Math.random() * .55);
    bolts.push(makeBolt(x, y, false));
    if (Math.random() < .22) setTimeout(() => bolts.push(makeBolt(x + (Math.random() - .5) * 160, y * (.8 + Math.random() * .3), false)), 120 + Math.random() * 200);
    if (soundOn && Math.random() < .7) thunder(.1 + Math.random() * .45);
  }
  setTimeout(weather, 500 + Math.random() * 1500);
}
if (!reduce) setTimeout(weather, 600);

function strike(x, y) {
  if (leaving) return;
  leaving = true;
  try { sessionStorage.setItem("unsaid-struck", "1"); } catch (e) { /* the mint page plays no flash-in; fine */ }
  if (reduce) { location.href = "mint.html"; return; }
  audio();
  if (rec) thunder(1);
  else Promise.race([recReady, new Promise(r => setTimeout(r, 220))]).then(() => thunder(1));   // first gesture: give the recording a moment to decode
  bolts.push(makeBolt(x, y, true));
  setTimeout(() => bolts.push(makeBolt(x + (Math.random() - .5) * 30, y, true)), 90);   // the return stroke
  flash.animate([{ opacity: 0 }, { opacity: .55 }, { opacity: .08 }, { opacity: .35 }, { opacity: 0 }], { duration: 520, easing: "ease-out" });
  setTimeout(() => {
    flash.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320, fill: "forwards", easing: "ease-in" });
  }, 1250);
  setTimeout(() => { if (ac) master.gain.setTargetAtTime(0, ac.currentTime, .15); }, 1300);
  setTimeout(() => { location.href = "mint.html"; }, 1650);
}
addEventListener("pointerdown", e => {
  if (e.target.closest(".sound")) return;
  if (e.button === 0 || e.pointerType !== "mouse") strike(e.clientX, e.clientY);
});
document.getElementById("hint").addEventListener("click", e => { e.preventDefault(); if (e.detail === 0) strike(W / 2, H * .62); });
addEventListener("pageshow", e => {
  if (e.persisted) { leaving = false; flash.getAnimations().forEach(a => a.cancel()); if (ac) master.gain.value = .8; }
});
</script>
</body>
</html>
